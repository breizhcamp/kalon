spring:
  datasource:
    url: jdbc:postgresql://localhost:4011/kalon
    username: kalon
    password: kalonpass

  jpa:
    show-sql: true

server.port: 4010


kalon:
    tenants:
      default: breizhcamp

      config:
        - name: breizhcamp
          domain: "localhost:4010"
          schema: breizhcamp
          auth:
            issuer-uri: http://localhost:4012/breizhcamp
            jwks-uri: http://localhost:4012/breizhcamp/jwks
          modules:
            - name: orga
              domain: "localhost:4000"

        - name: jsc
          domain: jsc.localhost
          schema: jsc
          auth:
            issuer-uri: http://localhost:4012/jsc
            jwks-uri: http://localhost:4012/jsc/jwks

