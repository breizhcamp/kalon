spring:
  datasource:
    url: jdbc:postgresql://localhost:4011/kalon
    username: kalon
    password: kalonpass

  jpa:
    show-sql: true

server.port: 4010


kalon:
    tenants:
      default: breizhcamp

      config:
        - name: breizhcamp
          domain: "localhost:4010"
          schema: breizhcamp
          auth:
            issuer-uri: https://auth.breizhcamp.org/auth/
            jwks-uri: https://auth.freefolks.rocks/auth/realms/BreizhCamp/protocol/openid-connect/certs
            realm: BreizhCamp
          modules:
            - name: orga
              domain: "localhost:4000"
              auth-client-id: orga-front


